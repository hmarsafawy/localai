[pytest]
pythonpath = .
testpaths = tests
# The end-to-end tests need the internet and minutes, so a plain `pytest` leaves
# them out. `pytest -m e2e` runs them, `-m "e2e and not conversion"` all but the
# slowest.
addopts = -m "not e2e" --strict-markers
markers =
    e2e: runs the real app, llama.cpp and a model from Hugging Face; needs the internet
    conversion: sets up llama.cpp's converter (about 1 GB) and converts a model with it
