[pytest]
pythonpath = .
testpaths = tests
# The end-to-end and contract tests need the internet, so a plain `pytest` leaves
# them out. `pytest -m e2e` runs the end-to-end ones (`-m "e2e and not
# conversion"` all but the slowest), `pytest -m contract` the contract ones.
addopts = -m "not e2e and not contract" --strict-markers
markers =
    e2e: runs the real app, llama.cpp and a model from Hugging Face; needs the internet
    conversion: sets up llama.cpp's converter (about 1 GB) and converts a model with it
    contract: checks GitHub and Hugging Face still answer the way the regular tests' stand-ins do; needs the internet
